<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Campus Resource Booking System</title>
    <meta name="description" content="Sign in to your university account to access campus resource reservations.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <!-- Navbar -->
    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8 col-lg-5">
                    <div class="card-custom p-4 p-md-5 bg-white shadow-md border-0">
                        <div class="text-center mb-4">
                            <div class="brand-icon-badge mx-auto mb-3" style="width:52px; height:52px; font-size:1.6rem;">
                                <i class="bi bi-person-fill-lock"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Campus Portal Sign In</h3>
                            <p class="text-secondary small">Access institutional bookings and schedules</p>
                        </div>

                        <!-- Status / Error Banner -->
                        <div id="loginAlert" class="alert d-none mb-3 py-2 px-3 small border-0" role="alert"></div>

                        <!-- Login Form -->
                        <form id="loginForm" novalidate>
                            <div class="mb-3">
                                <label for="email" class="form-label">Institutional Email</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                    <input type="email" class="form-control border-start-0" id="email" placeholder="user@campus.edu" required autocomplete="email">
                                </div>
                            </div>

                            <div class="mb-4">
                                <div class="d-flex justify-content-between align-items-center mb-1">
                                    <label for="password" class="form-label mb-0">Password</label>
                                </div>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                                    <input type="password" class="form-control border-start-0" id="password" placeholder="••••••••" required autocomplete="current-password">
                                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-semibold" id="loginBtn">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                            </button>
                        </form>

                        <!-- Quick Demo Credentials for Evaluation -->
                        <div class="mt-4 pt-4 border-top">
                            <div class="d-flex align-items-center justify-content-between mb-2">
                                <span class="small fw-bold text-muted text-uppercase tracking-wide">Quick Evaluator Logins</span>
                                <span class="badge bg-light text-secondary border">Academic Demo</span>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-sm btn-outline-danger text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('admin@campus.edu', 'Admin@123')">
                                    <span><i class="bi bi-shield-shaded me-1"></i> Admin</span>
                                    <span class="font-mono small">admin@campus.edu</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-primary text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('faculty@campus.edu', 'Faculty@123')">
                                    <span><i class="bi bi-mortarboard me-1"></i> Faculty</span>
                                    <span class="font-mono small">faculty@campus.edu</span>
                                </button>
                                <button type="button" class="btn btn-sm btn-outline-success text-start d-flex justify-content-between align-items-center" onclick="fillCredentials('student@campus.edu', 'Student@123')">
                                    <span><i class="bi bi-person me-1"></i> Student</span>
                                    <span class="font-mono small">student@campus.edu</span>
                                </button>
                            </div>
                        </div>

                        <div class="text-center mt-4">
                            <span class="text-muted small">Don't have an account?</span>
                            <a href="register.html" class="fw-semibold text-primary small ms-1 text-decoration-none">Register here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        const loginAlert = document.getElementById('loginAlert');

        function showLoginAlert(msg, type = 'danger') {
            loginAlert.className = `alert alert-${type} mb-3 py-2 px-3 small`;
            loginAlert.textContent = msg;
            loginAlert.classList.remove('d-none');
        }

        function hideLoginAlert() {
            loginAlert.classList.add('d-none');
        }

        // Check URL parameters for status notices
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('loggedOut') === 'true') {
            showLoginAlert('You have been logged out successfully.', 'info');
        } else if (urlParams.get('expired') === 'true') {
            showLoginAlert('Your session has expired. Please sign in again.', 'warning');
        } else if (urlParams.get('unauthorized') === 'true') {
            showLoginAlert('Authentication required. Please sign in to access this page.', 'warning');
        }

        function fillCredentials(email, pwd) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pwd;
            hideLoginAlert();
            Common.showToast(`Selected demo credentials for ${email}`, 'info');
        }

        document.getElementById('togglePassword').addEventListener('click', function() {
            const pwdInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                icon.className = 'bi bi-eye-slash';
            } else {
                pwdInput.type = 'password';
                icon.className = 'bi bi-eye';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideLoginAlert();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');

            if (!email || !password) {
                showLoginAlert('Please enter both email and password.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

            try {
                await Auth.handleLogin(email, password);
            } catch (err) {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i> Sign In';
                showLoginAlert(err.message || 'Invalid email or password combination.', 'danger');
            }
        });
    </script>
</body>
</html>
