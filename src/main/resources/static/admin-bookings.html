<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Management | Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <div id="navbar-placeholder"></div>

    <main class="py-4">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h2 class="fw-bold mb-1">Campus Reservations Master List</h2>
                    <p class="text-secondary small mb-0">Review student and faculty booking requests, execute approvals, or reject with feedback.</p>
                </div>
                <div>
                    <button class="btn btn-primary" onclick="Common.showAdminVerifyCheckInModal(() => loadAdminBookings())">
                        <i class="bi bi-qr-code-scan me-1"></i> Scan / Verify Check-In
                    </button>
                </div>
            </div>

            <!-- Filter Status Bar -->
            <div class="card-custom p-3 bg-white mb-4 border-0 shadow-sm">
                <div class="d-flex flex-wrap gap-2" id="adminFilterButtons">
                    <button class="btn btn-sm btn-primary-custom active" data-status="">All Reservations</button>
                    <button class="btn btn-sm btn-outline-custom" data-status="PENDING">Pending Approval</button>
                    <button class="btn btn-sm btn-outline-custom" data-status="APPROVED">Approved</button>
                    <button class="btn btn-sm btn-outline-custom" data-status="COMPLETED">Completed</button>
                    <button class="btn btn-sm btn-outline-custom" data-status="CANCELLED">Cancelled</button>
                    <button class="btn btn-sm btn-outline-custom" data-status="REJECTED">Rejected</button>
                </div>
            </div>

            <!-- Master Table -->
            <div class="card-custom p-4 bg-white border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>User / Requester</th>
                                <th>Facility</th>
                                <th>Date & Interval</th>
                                <th>Purpose</th>
                                <th>Status</th>
                                <th>Remark</th>
                                <th>Admin Actions</th>
                            </tr>
                        </thead>
                        <tbody id="adminBookingsTbody">
                            <tr>
                                <td colspan="8" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Reject Modal -->
    <div class="modal fade" id="rejectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-danger"><i class="bi bi-x-circle-fill me-2"></i> Reject Reservation Request</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-3">
                    <p class="small text-secondary mb-3">Provide administrative justification for rejecting booking <strong id="rejectModalIdText"></strong>.</p>
                    <label for="rejectRemarkInput" class="form-label small fw-bold">Rejection Reason</label>
                    <textarea class="form-control" id="rejectRemarkInput" rows="3" placeholder="State reason (e.g. Schedule clash with University Senate Meeting)" required></textarea>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmRejectBtn">Reject Request</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        let currentFilter = '';
        let targetRejectId = null;
        let rejectModalInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth(['ADMIN'])) return;

            rejectModalInstance = new bootstrap.Modal(document.getElementById('rejectModal'));
            document.getElementById('confirmRejectBtn').addEventListener('click', executeRejection);

            document.querySelectorAll('#adminFilterButtons button').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('#adminFilterButtons button').forEach(b => {
                        b.classList.remove('btn-primary-custom', 'active');
                        b.classList.add('btn-outline-custom');
                    });
                    this.classList.remove('btn-outline-custom');
                    this.classList.add('btn-primary-custom', 'active');

                    currentFilter = this.getAttribute('data-status');
                    loadAdminBookings();
                });
            });

            await loadAdminBookings();
        });

        async function loadAdminBookings() {
            const tbody = document.getElementById('adminBookingsTbody');
            tbody.innerHTML = `<tr><td colspan="8" class="text-center py-5 text-muted"><div class="spinner-border spinner-border-sm text-primary"></div></td></tr>`;

            try {
                const res = await API.getBookings(currentFilter || null);
                if (res.success && res.data) {
                    const list = res.data;
                    if (list.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="8" class="text-center py-5 text-muted">No reservations found for this filter.</td></tr>';
                        return;
                    }

                    tbody.innerHTML = list.map(b => `
                        <tr>
                            <td class="font-mono fw-bold text-muted">#${b.bookingId}</td>
                            <td>
                                <div class="fw-bold text-dark">${Common.escapeHtml(b.userName)}</div>
                                <span class="badge bg-light text-dark border small">${b.userRole} • ${Common.escapeHtml(b.userDepartment || '')}</span>
                            </td>
                            <td>
                                <div class="fw-semibold text-dark">${Common.escapeHtml(b.resourceName)}</div>
                                <div class="text-muted small">${Common.escapeHtml(b.location || '')}</div>
                            </td>
                            <td>
                                <div>${Common.formatDate(b.bookingDate)}</div>
                                <div class="text-muted small">${Common.formatTime(b.startTime)} - ${Common.formatTime(b.endTime)} (${b.durationHours} hrs)</div>
                            </td>
                            <td><span class="text-truncate d-inline-block" style="max-width:140px;" title="${Common.escapeHtml(b.purpose)}">${Common.escapeHtml(b.purpose)}</span></td>
                            <td>
                                <span class="badge-status badge-status-${b.status.toLowerCase()}">${b.status}</span>
                                ${b.checkedIn ? `
                                    <span class="badge bg-success text-white d-block mt-1 py-1" style="font-size: 0.65rem;">
                                        <i class="bi bi-check-circle-fill me-1"></i> Checked In
                                    </span>
                                ` : ''}
                            </td>
                            <td><span class="small text-muted">${Common.escapeHtml(b.adminRemark || '-')}</span></td>
                            <td>
                                <div class="btn-group btn-group-sm">
                                    ${b.status === 'PENDING' ? `
                                        <button class="btn btn-success" onclick="approveBooking(${b.bookingId})" title="Approve">
                                            <i class="bi bi-check-lg"></i>
                                        </button>
                                        <button class="btn btn-outline-danger" onclick="openRejectModal(${b.bookingId})" title="Reject">
                                            <i class="bi bi-x-lg"></i>
                                        </button>
                                    ` : ''}
                                    ${b.status === 'APPROVED' ? `
                                        <button class="btn btn-primary" onclick="executeCheckIn(${b.bookingId})" ${b.checkedIn ? 'disabled' : ''} title="${b.checkedIn ? 'Already Checked In' : 'Confirm Check-In'}">
                                            <i class="bi bi-check2-circle"></i> ${b.checkedIn ? 'In' : 'Check In'}
                                        </button>
                                        <button class="btn btn-outline-secondary" onclick='Common.showQRPassModal(${JSON.stringify(b).replace(/'/g, "&apos;")})' title="View Entry Pass">
                                            <i class="bi bi-qr-code"></i>
                                        </button>
                                        <button class="btn btn-outline-info" onclick="completeBooking(${b.bookingId})" title="Mark Completed">
                                            <i class="bi bi-check2-all"></i>
                                        </button>
                                        <button class="btn btn-outline-danger" onclick="cancelBookingAdmin(${b.bookingId})" title="Cancel Booking">
                                            <i class="bi bi-slash-circle"></i>
                                        </button>
                                    ` : ''}
                                    ${(b.status === 'COMPLETED' || b.status === 'CANCELLED' || b.status === 'REJECTED') ? `
                                        <span class="text-muted small px-2">Archived</span>
                                    ` : ''}
                                </div>
                            </td>
                        </tr>
                    `).join('');
                }
            } catch (err) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-4 text-danger">${Common.escapeHtml(err.message)}</td></tr>`;
            }
        }

        async function approveBooking(id) {
            try {
                const res = await API.approveBooking(id, 'Approved by Administrator');
                if (res.success) {
                    Common.showToast(`Booking #${id} approved successfully!`, 'success');
                    loadAdminBookings();
                }
            } catch (err) {
                Common.showToast(err.message || 'Approval failed', 'error');
            }
        }

        function openRejectModal(id) {
            targetRejectId = id;
            document.getElementById('rejectModalIdText').textContent = `#${id}`;
            document.getElementById('rejectRemarkInput').value = '';
            rejectModalInstance.show();
        }

        async function executeRejection() {
            if (!targetRejectId) return;
            const remark = document.getElementById('rejectRemarkInput').value.trim();
            if (!remark) {
                Common.showToast('Please provide a remark.', 'warning');
                return;
            }

            try {
                const res = await API.rejectBooking(targetRejectId, remark);
                if (res.success) {
                    Common.showToast(`Booking #${targetRejectId} rejected.`, 'info');
                    rejectModalInstance.hide();
                    loadAdminBookings();
                }
            } catch (err) {
                Common.showToast(err.message || 'Rejection failed', 'error');
            }
        }

        async function completeBooking(id) {
            try {
                const res = await API.completeBooking(id);
                if (res.success) {
                    Common.showToast(`Booking #${id} marked as completed.`, 'info');
                    loadAdminBookings();
                }
            } catch (err) {
                Common.showToast(err.message || 'Operation failed', 'error');
            }
        }

        async function cancelBookingAdmin(id) {
            if (!confirm(`Are you sure you want to cancel booking #${id}?`)) return;
            try {
                const res = await API.cancelBooking(id);
                if (res.success) {
                    Common.showToast(`Booking #${id} cancelled.`, 'info');
                    loadAdminBookings();
                }
            } catch (err) {
                Common.showToast(err.message || 'Cancellation failed', 'error');
            }
        }

        async function executeCheckIn(id) {
            try {
                const res = await API.checkInBooking(id);
                if (res.success) {
                    Common.showToast(`Check-in verified for booking #${id}!`, 'success');
                    loadAdminBookings();
                }
            } catch (err) {
                Common.showToast(err.message || 'Check-in failed', 'error');
            }
        }
    </script>
</body>
</html>
