<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Details | Campus Resource Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <div id="navbar-placeholder"></div>

    <main class="py-4">
        <div class="container">
            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item"><a href="resources.html" class="text-decoration-none">Resources</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbName">Details</li>
                </ol>
            </nav>

            <div id="resourceDetailContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-primary" role="status"></div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const resourceId = Common.getUrlParam('id');
            if (!resourceId) {
                window.location.href = 'resources.html';
                return;
            }

            try {
                const res = await API.getResourceById(resourceId);
                if (res.success && res.data) {
                    renderResource(res.data);
                    loadSchedule(resourceId, new Date().toISOString().split('T')[0]);
                }
            } catch (err) {
                document.getElementById('resourceDetailContainer').innerHTML = `
                    <div class="alert alert-danger p-4 text-center">
                        <i class="bi bi-exclamation-triangle-fill fs-3 mb-2"></i>
                        <p class="mb-0">${Common.escapeHtml(err.message || 'Facility not found.')}</p>
                        <a href="resources.html" class="btn btn-outline-danger mt-3">Back to Catalog</a>
                    </div>
                `;
            }
        });

        function renderResource(r) {
            document.getElementById('breadcrumbName').textContent = r.resourceName;
            document.title = `${r.resourceName} | Campus Resource Booking`;

            const facilitiesList = (r.facilities || '')
                .split(',')
                .map(f => f.trim())
                .filter(Boolean);

            const container = document.getElementById('resourceDetailContainer');
            container.innerHTML = `
                <div class="row g-4">
                    <div class="col-lg-7">
                        <div class="card-custom bg-white p-0 overflow-hidden mb-4 border-0 shadow-sm">
                            <img src="${r.imageUrl || 'https://images.unsplash.com/photo-1562774053-701939374585?w=800&auto=format&fit=crop&q=80'}" 
                                 class="w-100" style="max-height:380px; object-fit:cover;"
                                 alt="${Common.escapeHtml(r.resourceName)}">
                            <div class="p-4">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <span class="badge bg-light text-primary border fw-semibold">
                                        <i class="bi ${r.categoryIcon || 'bi-building'} me-1"></i> ${Common.escapeHtml(r.categoryName || 'General')}
                                    </span>
                                    <span class="badge-status badge-status-${r.status.toLowerCase()}">${r.status}</span>
                                </div>
                                <h2 class="fw-bold text-dark mb-2">${Common.escapeHtml(r.resourceName)}</h2>
                                <p class="text-muted"><i class="bi bi-geo-alt-fill text-danger me-1"></i> ${Common.escapeHtml(r.location)}</p>
                                
                                <h6 class="fw-bold mt-4 mb-2">Description</h6>
                                <p class="text-secondary">${Common.escapeHtml(r.description || 'No detailed description available.')}</p>

                                <h6 class="fw-bold mt-4 mb-2">Installed Equipment & Amenities</h6>
                                <div class="d-flex flex-wrap gap-2 mb-4">
                                    ${facilitiesList.length > 0 ? facilitiesList.map(f => `
                                        <span class="badge bg-light text-dark border px-3 py-2 fw-medium">
                                            <i class="bi bi-check-circle-fill text-success me-1"></i> ${Common.escapeHtml(f)}
                                        </span>
                                    `).join('') : '<span class="text-muted small">Standard campus utilities.</span>'}
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-5">
                        <!-- Quick Book Box -->
                        <div class="card-custom p-4 bg-white mb-4 border-0 shadow-sm">
                            <h5 class="fw-bold mb-3"><i class="bi bi-calendar-check me-2 text-primary"></i> Reservation Details</h5>
                            <div class="list-group list-group-flush mb-3">
                                <div class="list-group-item d-flex justify-content-between px-0 py-2">
                                    <span class="text-muted">Maximum Capacity</span>
                                    <span class="fw-bold text-dark">${r.capacity} Persons</span>
                                </div>
                                <div class="list-group-item d-flex justify-content-between px-0 py-2">
                                    <span class="text-muted">Operational State</span>
                                    <span class="badge-status badge-status-${r.status.toLowerCase()}">${r.status}</span>
                                </div>
                                <div class="list-group-item d-flex justify-content-between px-0 py-2">
                                    <span class="text-muted">Department / Category</span>
                                    <span class="fw-semibold">${Common.escapeHtml(r.categoryName || 'General')}</span>
                                </div>
                            </div>

                            ${Auth.getRole() === 'STUDENT' ? `
                                <div class="alert alert-info mb-0 text-center small py-2">
                                    <i class="bi bi-info-circle me-1"></i> <strong>Student View-Only:</strong> Reservations are restricted to Faculty & Admin. You can inspect timetable and upcoming bookings below.
                                </div>
                            ` : (r.status === 'AVAILABLE' ? `
                                <a href="booking.html?resourceId=${r.resourceId}" class="btn btn-primary-custom w-100 py-2 fw-semibold">
                                    <i class="bi bi-calendar-plus me-1"></i> Book This Resource
                                </a>
                            ` : `
                                <div class="alert alert-warning mb-0 text-center small py-2">
                                    <i class="bi bi-exclamation-circle me-1"></i> Resource is currently under ${r.status}.
                                </div>
                            `)}
                        </div>

                        <!-- Daily Schedule Calendar -->
                        <div class="card-custom p-4 bg-white border-0 shadow-sm">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold mb-0"><i class="bi bi-calendar3 me-2 text-primary"></i> Active Schedule</h5>
                            </div>
                            <div class="mb-3">
                                <label for="scheduleDate" class="form-label small fw-bold">Select Date</label>
                                <input type="date" class="form-control form-control-sm" id="scheduleDate" value="${new Date().toISOString().split('T')[0]}" min="${new Date().toISOString().split('T')[0]}">
                            </div>
                            <div id="scheduleTimeline" class="small">
                                <div class="text-center py-3 text-muted">
                                    <div class="spinner-border spinner-border-sm text-primary"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('scheduleDate').addEventListener('change', (e) => {
                loadSchedule(r.resourceId, e.target.value);
            });
        }

        async function loadSchedule(resourceId, date) {
            const container = document.getElementById('scheduleTimeline');
            if (!container) return;

            try {
                const res = await API.getResourceSchedule(resourceId, date);
                if (res.success && res.data) {
                    const bookings = res.data.filter(b => b.status === 'PENDING' || b.status === 'APPROVED');
                    if (bookings.length === 0) {
                        container.innerHTML = `
                            <div class="p-3 bg-light rounded text-center text-success border border-success-subtle">
                                <i class="bi bi-check2-circle fs-5 d-block mb-1"></i>
                                <strong>Entire day is available!</strong>
                                <div class="text-muted" style="font-size:0.75rem;">No conflicting reservations on ${Common.formatDate(date)}.</div>
                            </div>
                        `;
                    } else {
                        container.innerHTML = `
                            <div class="text-muted mb-2 fw-semibold" style="font-size:0.8rem;">Occupied Time Slots:</div>
                            <div class="d-flex flex-column gap-2">
                                ${bookings.map(b => `
                                    <div class="timeline-slot slot-booked">
                                        <div>
                                            <div class="fw-bold"><i class="bi bi-lock-fill me-1"></i> ${Common.formatTime(b.startTime)} - ${Common.formatTime(b.endTime)}</div>
                                            <div class="text-truncate" style="max-width:200px;font-size:0.75rem;">Purpose: ${Common.escapeHtml(b.purpose)}</div>
                                        </div>
                                        <span class="badge bg-danger rounded-pill">${b.status}</span>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    }
                }
            } catch (err) {
                container.innerHTML = `<div class="text-danger small">Failed to load schedule: ${Common.escapeHtml(err.message)}</div>`;
            }
        }
    </script>
</body>
</html>
