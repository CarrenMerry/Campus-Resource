<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management | Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <div id="navbar-placeholder"></div>

    <main class="py-4">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h2 class="fw-bold mb-1">Campus User Management</h2>
                    <p class="text-secondary small mb-0">Inspect user accounts, role-specific credentials, and enable/disable portal access.</p>
                </div>
            </div>

            <!-- Filters -->
            <div class="card-custom p-4 bg-white mb-4 border-0 shadow-sm">
                <div class="row g-3">
                    <div class="col-md-7">
                        <label for="userSearchInput" class="form-label">Search Users</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" class="form-control border-start-0" id="userSearchInput" placeholder="Search by name, email, department, roll number...">
                        </div>
                    </div>
                    <div class="col-md-5">
                        <label for="roleFilterSelect" class="form-label">Filter by Role</label>
                        <select class="form-select" id="roleFilterSelect">
                            <option value="">All Roles</option>
                            <option value="STUDENT">Students</option>
                            <option value="FACULTY">Faculty</option>
                            <option value="ADMIN">Administrators</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Users Table -->
            <div class="card-custom p-4 bg-white border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>User ID</th>
                                <th>Name & Email</th>
                                <th>Role</th>
                                <th>Department</th>
                                <th>Identifier / Tier</th>
                                <th>Account State</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- User Details Modal -->
    <div class="modal fade" id="userDetailsModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="modalUserName">User Profile</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body py-3" id="modalUserContent">
                    <!-- Dynamic details populated via JS -->
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        let usersData = [];
        let detailsModalInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth(['ADMIN'])) return;

            detailsModalInstance = new bootstrap.Modal(document.getElementById('userDetailsModal'));

            document.getElementById('userSearchInput').addEventListener('input', debounce(loadUsers, 300));
            document.getElementById('roleFilterSelect').addEventListener('change', loadUsers);

            await loadUsers();
        });

        async function loadUsers() {
            const search = document.getElementById('userSearchInput').value.trim();
            const role = document.getElementById('roleFilterSelect').value;

            try {
                const res = await API.getAdminUsers({ search: search || undefined, role: role || undefined });
                if (res.success && res.data) {
                    usersData = res.data;
                    renderUsersTable(usersData);
                }
            } catch (err) {
                document.getElementById('usersTableBody').innerHTML = `
                    <tr><td colspan="7" class="text-center py-4 text-danger">${Common.escapeHtml(err.message || 'Failed to load users')}</td></tr>
                `;
            }
        }

        function renderUsersTable(list) {
            const tbody = document.getElementById('usersTableBody');
            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-muted">No users found matching query.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(u => {
                let badgeClass = 'bg-secondary';
                if (u.role === 'ADMIN') badgeClass = 'bg-danger';
                if (u.role === 'FACULTY') badgeClass = 'bg-primary';
                if (u.role === 'STUDENT') badgeClass = 'bg-info text-dark';

                let identifier = '-';
                if (u.studentRollNumber) identifier = `Roll: ${u.studentRollNumber}`;
                else if (u.employeeId) identifier = `Emp: ${u.employeeId}`;
                else if (u.adminCode) identifier = `Code: ${u.adminCode}`;

                return `
                    <tr>
                        <td class="font-mono text-muted">#${u.userId}</td>
                        <td>
                            <div class="fw-bold text-dark">${Common.escapeHtml(u.name)}</div>
                            <div class="text-muted small">${Common.escapeHtml(u.email)}</div>
                        </td>
                        <td><span class="badge ${badgeClass} rounded-pill">${u.role}</span></td>
                        <td>${Common.escapeHtml(u.department || '-')}</td>
                        <td><span class="font-mono small">${identifier}</span></td>
                        <td>
                            ${u.active ? 
                                '<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill">Active</span>' : 
                                '<span class="badge bg-danger-subtle text-danger border border-danger-subtle rounded-pill">Deactivated</span>'}
                        </td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <button class="btn btn-outline-custom" onclick="viewUserDetails(${u.userId})" title="View Details">
                                    <i class="bi bi-eye"></i>
                                </button>
                                ${u.role !== 'ADMIN' ? `
                                    <button class="btn ${u.active ? 'btn-outline-danger' : 'btn-outline-success'}" 
                                            onclick="toggleUser(${u.userId}, ${!u.active})"
                                            title="${u.active ? 'Deactivate User' : 'Activate User'}">
                                        <i class="bi ${u.active ? 'bi-person-slash' : 'bi-person-check'}"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function viewUserDetails(id) {
            const u = usersData.find(x => x.userId === id);
            if (!u) return;

            document.getElementById('modalUserName').textContent = u.name;
            document.getElementById('modalUserContent').innerHTML = `
                <div class="list-group list-group-flush small">
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">User ID</span>
                        <span class="font-mono fw-bold">#${u.userId}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Email</span>
                        <span class="fw-semibold">${Common.escapeHtml(u.email)}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Phone Number</span>
                        <span>${Common.escapeHtml(u.phone || 'N/A')}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Department</span>
                        <span>${Common.escapeHtml(u.department || 'N/A')}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">System Role</span>
                        <span class="badge bg-primary">${u.role}</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Tier Max Duration</span>
                        <span><strong>${u.maxBookingHours}</strong> hours / booking session</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Tier Max Active Bookings</span>
                        <span><strong>${u.maxActiveBookings}</strong> concurrent requests</span>
                    </div>
                    <div class="list-group-item d-flex justify-content-between px-0 py-2">
                        <span class="text-muted">Role Policy Summary</span>
                        <span class="text-end text-secondary">${Common.escapeHtml(u.roleDescription || '')}</span>
                    </div>
                </div>
            `;
            detailsModalInstance.show();
        }

        async function toggleUser(id, targetActive) {
            const action = targetActive ? 'activate' : 'deactivate';
            if (!confirm(`Are you sure you want to ${action} this user account?`)) return;

            try {
                const res = await API.toggleUserStatus(id, targetActive);
                if (res.success) {
                    Common.showToast(`User account updated successfully.`, 'success');
                    loadUsers();
                }
            } catch (err) {
                Common.showToast(err.message || 'Operation failed', 'error');
            }
        }

        function debounce(func, wait) {
            let timeout;
            return function(...args) {
                clearTimeout(timeout);
                timeout = setTimeout(() => func.apply(this, args), wait);
            };
        }
    </script>
</body>
</html>
