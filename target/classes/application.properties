# ==============================================================================
# Campus Resource Booking System - Main Application Configuration
# ==============================================================================

server.port=8080
spring.application.name=campus-resource-booking

# Active Profile: Defaults to 'mysql'. Can be switched to 'h2' for local testing
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}

# JWT Secret Token Key
app.jwt.secret=${JWT_SECRET:campusResourceBookingSystemSecureSecretKey2026MCAProjectAcademicKey1234567890}

# Static Frontend Resources
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# JSON Date/Time formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false
