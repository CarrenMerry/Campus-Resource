<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Campus Resource Booking System</title>
    <meta name="description" content="Create a new campus portal account as a student or faculty member.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <div id="navbar-placeholder"></div>

    <main class="py-5">
        <div class="container py-3">
            <div class="row justify-content-center">
                <div class="col-md-9 col-lg-7">
                    <div class="card-custom p-4 p-md-5 bg-white shadow-md border-0">
                        <div class="text-center mb-4">
                            <div class="brand-icon-badge mx-auto mb-3" style="width:52px; height:52px; font-size:1.6rem;">
                                <i class="bi bi-person-plus-fill"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Create Institutional Account</h3>
                            <p class="text-secondary small">Register as a Student (view-only schedules) or Faculty member (facility reservations)</p>
                        </div>

                        <!-- Status / Error Banner -->
                        <div id="registerAlert" class="alert d-none mb-3 py-2 px-3 small border-0" role="alert"></div>

                        <form id="registerForm" novalidate>
                            <div class="row g-3">
                                <!-- Role Selection -->
                                <div class="col-12">
                                    <label class="form-label fw-bold">Select Role <span class="text-danger">*</span></label>
                                    <div class="row g-2">
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="roleStudent" value="STUDENT" checked>
                                            <label class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2" for="roleStudent">
                                                <i class="bi bi-mortarboard-fill text-primary"></i> Student (View-Only)
                                            </label>
                                        </div>
                                        <div class="col-6">
                                            <input type="radio" class="btn-check" name="role" id="roleFaculty" value="FACULTY">
                                            <label class="btn btn-outline-custom w-100 py-2 d-flex align-items-center justify-content-center gap-2" for="roleFaculty">
                                                <i class="bi bi-briefcase-fill text-primary"></i> Faculty (Can Book)
                                            </label>
                                        </div>
                                    </div>
                                    <div class="form-text small">Note: Facility reservations are reserved for Faculty and Administrators. Students have real-time schedule view access.</div>
                                </div>

                                <!-- Full Name -->
                                <div class="col-md-6">
                                    <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                                    <input type="text" class="form-control" id="name" placeholder="e.g. John Doe" required>
                                </div>

                                <!-- Email -->
                                <div class="col-md-6">
                                    <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                                    <input type="email" class="form-control" id="email" placeholder="name@campus.edu" required>
                                </div>

                                <!-- Password -->
                                <div class="col-md-6">
                                    <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                                    <input type="password" class="form-control" id="password" placeholder="At least 6 characters" minlength="6" required>
                                </div>

                                <!-- Phone -->
                                <div class="col-md-6">
                                    <label for="phone" class="form-label">Phone Number</label>
                                    <input type="tel" class="form-control" id="phone" placeholder="e.g. 9876543210">
                                </div>

                                <!-- Department -->
                                <div class="col-12">
                                    <label for="department" class="form-label">Academic Department <span class="text-danger">*</span></label>
                                    <select class="form-select" id="department" required>
                                        <option value="">Choose department...</option>
                                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                        <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                                        <option value="Information Technology">Information Technology</option>
                                        <option value="Electronics & Communication">Electronics & Communication</option>
                                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                                        <option value="Management Studies">Management Studies</option>
                                    </select>
                                </div>

                                <!-- Student Specific Fields -->
                                <div id="studentFields" class="row g-3 pe-0">
                                    <div class="col-md-6">
                                        <label for="studentRollNumber" class="form-label">Student Roll Number <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="studentRollNumber" placeholder="e.g. MCA202401">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="semester" class="form-label">Current Semester <span class="text-danger">*</span></label>
                                        <select class="form-select" id="semester">
                                            <option value="1">Semester 1</option>
                                            <option value="2">Semester 2</option>
                                            <option value="3" selected>Semester 3</option>
                                            <option value="4">Semester 4</option>
                                            <option value="5">Semester 5</option>
                                            <option value="6">Semester 6</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Faculty Specific Fields -->
                                <div id="facultyFields" class="row g-3 pe-0 d-none">
                                    <div class="col-md-6">
                                        <label for="employeeId" class="form-label">Employee ID <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="employeeId" placeholder="e.g. FAC-CS-101">
                                    </div>
                                    <div class="col-md-6">
                                        <label for="designation" class="form-label">Designation <span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="designation" placeholder="e.g. Assistant Professor">
                                    </div>
                                </div>
                            </div>

                            <div class="mt-4">
                                <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 fw-semibold" id="registerBtn">
                                    <i class="bi bi-check2-circle me-1"></i> Register Account
                                </button>
                            </div>

                            <div class="text-center mt-3">
                                <span class="text-muted small">Already have an account?</span>
                                <a href="login.html" class="fw-semibold text-primary small ms-1 text-decoration-none">Sign in here</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        const studentRadio = document.getElementById('roleStudent');
        const facultyRadio = document.getElementById('roleFaculty');
        const studentFields = document.getElementById('studentFields');
        const facultyFields = document.getElementById('facultyFields');

        function toggleRoleFields() {
            if (studentRadio.checked) {
                studentFields.classList.remove('d-none');
                facultyFields.classList.add('d-none');
            } else {
                studentFields.classList.add('d-none');
                facultyFields.classList.remove('d-none');
            }
        }

        const registerAlert = document.getElementById('registerAlert');

        function showRegisterAlert(msg, type = 'danger') {
            registerAlert.className = `alert alert-${type} mb-3 py-2 px-3 small`;
            registerAlert.textContent = msg;
            registerAlert.classList.remove('d-none');
        }

        function hideRegisterAlert() {
            registerAlert.classList.add('d-none');
        }

        studentRadio.addEventListener('change', () => { hideRegisterAlert(); toggleRoleFields(); });
        facultyRadio.addEventListener('change', () => { hideRegisterAlert(); toggleRoleFields(); });

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            hideRegisterAlert();

            const role = studentRadio.checked ? 'STUDENT' : 'FACULTY';
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const phone = document.getElementById('phone').value.trim();
            const department = document.getElementById('department').value;

            if (!name || !email || !password || !department) {
                showRegisterAlert('Please fill all mandatory fields (Name, Email, Password, Department).');
                return;
            }

            if (password.length < 6) {
                showRegisterAlert('Password must be at least 6 characters long.');
                return;
            }

            const payload = {
                role,
                name,
                email,
                password,
                phone,
                department
            };

            if (role === 'STUDENT') {
                const roll = document.getElementById('studentRollNumber').value.trim();
                const sem = parseInt(document.getElementById('semester').value, 10);
                if (!roll) {
                    showRegisterAlert('Student roll number is required.');
                    return;
                }
                payload.studentRollNumber = roll;
                payload.semester = sem;
            } else {
                const empId = document.getElementById('employeeId').value.trim();
                const desig = document.getElementById('designation').value.trim();
                if (!empId || !desig) {
                    showRegisterAlert('Employee ID and Designation are required for Faculty registration.');
                    return;
                }
                payload.employeeId = empId;
                payload.designation = desig;
            }

            const btn = document.getElementById('registerBtn');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating account...';

            try {
                const res = await API.register(payload);
                if (res.success) {
                    showRegisterAlert('Registration successful! Redirecting to login...', 'success');
                    Common.showToast('Registration successful! Redirecting to login...', 'success');
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                }
            } catch (err) {
                const errorMsg = err.message || 'Registration failed. Please verify your inputs.';
                showRegisterAlert(errorMsg, 'danger');
                Common.showToast(errorMsg, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-check2-circle me-1"></i> Register Account';
            }
        });
    </script>
</body>
</html>
