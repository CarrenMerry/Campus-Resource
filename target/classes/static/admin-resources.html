<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facility Management | Admin Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-page">

    <div id="navbar-placeholder"></div>

    <main class="py-4">
        <div class="container">
            <div class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-3">
                <div>
                    <h2 class="fw-bold mb-1">Campus Facility Administration</h2>
                    <p class="text-secondary small mb-0">Create new classrooms and laboratories, edit specifications, or adjust maintenance schedules.</p>
                </div>
                <button class="btn btn-primary-custom" onclick="openCreateResourceModal()">
                    <i class="bi bi-plus-circle me-1"></i> Add Campus Resource
                </button>
            </div>

            <!-- Table of resources -->
            <div class="card-custom p-4 bg-white border-0 shadow-sm">
                <div class="table-responsive">
                    <table class="table table-custom align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Facility ID</th>
                                <th>Resource Name</th>
                                <th>Category</th>
                                <th>Location</th>
                                <th>Capacity</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="resourcesAdminTbody">
                            <tr>
                                <td colspan="7" class="text-center py-5 text-muted">
                                    <div class="spinner-border text-primary" role="status"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <!-- Create / Edit Resource Modal -->
    <div class="modal fade" id="resourceModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="resourceModalTitle">Add New Campus Resource</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form id="resourceForm" novalidate>
                    <div class="modal-body py-4">
                        <input type="hidden" id="editResourceId">
                        <div class="row g-3">
                            <div class="col-md-7">
                                <label for="mResourceName" class="form-label">Resource Name <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="mResourceName" placeholder="e.g. Advanced AI & Robotics Lab" required>
                            </div>
                            <div class="col-md-5">
                                <label for="mCategory" class="form-label">Category <span class="text-danger">*</span></label>
                                <select class="form-select" id="mCategory" required>
                                    <option value="">Select Category...</option>
                                </select>
                            </div>
                            <div class="col-md-7">
                                <label for="mLocation" class="form-label">Campus Location <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="mLocation" placeholder="e.g. Block C - 3rd Floor, Room 302" required>
                            </div>
                            <div class="col-md-5">
                                <label for="mCapacity" class="form-label">Capacity (Persons) <span class="text-danger">*</span></label>
                                <input type="number" class="form-control" id="mCapacity" min="1" max="5000" placeholder="e.g. 60" required>
                            </div>
                            <div class="col-12">
                                <label for="mFacilities" class="form-label">Facilities / Amenities (Comma Separated)</label>
                                <input type="text" class="form-control" id="mFacilities" placeholder="Projector, Central HVAC, Gigabit Ethernet, Sound System">
                            </div>
                            <div class="col-md-6">
                                <label for="mStatus" class="form-label">Operational Status</label>
                                <select class="form-select" id="mStatus">
                                    <option value="AVAILABLE">Available</option>
                                    <option value="MAINTENANCE">Maintenance</option>
                                    <option value="INACTIVE">Inactive</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="mImageUrl" class="form-label">Facility Image URL</label>
                                <input type="url" class="form-control" id="mImageUrl" placeholder="https://example.com/photo.jpg">
                            </div>
                            <div class="col-12">
                                <label for="mDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="mDescription" rows="3" placeholder="Provide details about the equipment, purpose, and booking prerequisites."></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer border-0 pt-0">
                        <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom" id="saveResourceBtn">Save Facility</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script>
        let resourcesList = [];
        let categoriesList = [];
        let resourceModalInstance = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (!Auth.requireAuth(['ADMIN'])) return;

            resourceModalInstance = new bootstrap.Modal(document.getElementById('resourceModal'));

            // Load Categories for modal
            try {
                const catRes = await API.getCategories();
                if (catRes.success && catRes.data) {
                    categoriesList = catRes.data;
                    const catSelect = document.getElementById('mCategory');
                    categoriesList.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c.categoryId;
                        opt.textContent = c.categoryName;
                        catSelect.appendChild(opt);
                    });
                }
            } catch (err) {
                console.error(err);
            }

            document.getElementById('resourceForm').addEventListener('submit', handleSaveResource);

            await loadResources();
        });

        async function loadResources() {
            try {
                const res = await API.getResources();
                if (res.success && res.data) {
                    resourcesList = res.data;
                    renderTable(resourcesList);
                }
            } catch (err) {
                document.getElementById('resourcesAdminTbody').innerHTML = `
                    <tr><td colspan="7" class="text-center py-4 text-danger">${Common.escapeHtml(err.message)}</td></tr>
                `;
            }
        }

        function renderTable(list) {
            const tbody = document.getElementById('resourcesAdminTbody');
            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center py-4 text-muted">No campus facilities configured.</td></tr>';
                return;
            }

            tbody.innerHTML = list.map(r => `
                <tr>
                    <td class="font-mono text-muted">#${r.resourceId}</td>
                    <td>
                        <div class="fw-bold text-dark">${Common.escapeHtml(r.resourceName)}</div>
                    </td>
                    <td><span class="badge bg-light text-primary border">${Common.escapeHtml(r.categoryName || 'General')}</span></td>
                    <td><span class="small">${Common.escapeHtml(r.location)}</span></td>
                    <td><strong>${r.capacity}</strong></td>
                    <td><span class="badge-status badge-status-${r.status.toLowerCase()}">${r.status}</span></td>
                    <td>
                        <div class="btn-group btn-group-sm">
                            <button class="btn btn-outline-custom" onclick="openEditResourceModal(${r.resourceId})" title="Edit Facility">
                                <i class="bi bi-pencil-square"></i>
                            </button>
                            ${r.status === 'AVAILABLE' ? `
                                <button class="btn btn-outline-warning" onclick="changeStatus(${r.resourceId}, 'MAINTENANCE')" title="Mark Maintenance">
                                    <i class="bi bi-tools"></i>
                                </button>
                            ` : `
                                <button class="btn btn-outline-success" onclick="changeStatus(${r.resourceId}, 'AVAILABLE')" title="Set Available">
                                    <i class="bi bi-check-circle"></i>
                                </button>
                            `}
                            <button class="btn btn-outline-danger" onclick="softDeleteResource(${r.resourceId})" title="Deactivate">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openCreateResourceModal() {
            document.getElementById('editResourceId').value = '';
            document.getElementById('resourceModalTitle').textContent = 'Add New Campus Resource';
            document.getElementById('mResourceName').value = '';
            document.getElementById('mCategory').value = '';
            document.getElementById('mLocation').value = '';
            document.getElementById('mCapacity').value = '';
            document.getElementById('mFacilities').value = '';
            document.getElementById('mStatus').value = 'AVAILABLE';
            document.getElementById('mImageUrl').value = '';
            document.getElementById('mDescription').value = '';
            resourceModalInstance.show();
        }

        function openEditResourceModal(id) {
            const r = resourcesList.find(x => x.resourceId === id);
            if (!r) return;

            document.getElementById('editResourceId').value = r.resourceId;
            document.getElementById('resourceModalTitle').textContent = `Edit Resource #${r.resourceId}`;
            document.getElementById('mResourceName').value = r.resourceName;
            document.getElementById('mCategory').value = r.categoryId || '';
            document.getElementById('mLocation').value = r.location;
            document.getElementById('mCapacity').value = r.capacity;
            document.getElementById('mFacilities').value = r.facilities || '';
            document.getElementById('mStatus').value = r.status;
            document.getElementById('mImageUrl').value = r.imageUrl || '';
            document.getElementById('mDescription').value = r.description || '';
            resourceModalInstance.show();
        }

        async function handleSaveResource(e) {
            e.preventDefault();
            const editId = document.getElementById('editResourceId').value;
            const resourceName = document.getElementById('mResourceName').value.trim();
            const categoryId = parseInt(document.getElementById('mCategory').value, 10);
            const location = document.getElementById('mLocation').value.trim();
            const capacity = parseInt(document.getElementById('mCapacity').value, 10);
            const facilities = document.getElementById('mFacilities').value.trim();
            const status = document.getElementById('mStatus').value;
            const imageUrl = document.getElementById('mImageUrl').value.trim();
            const description = document.getElementById('mDescription').value.trim();

            if (!resourceName || !categoryId || !location || !capacity) {
                Common.showToast('Please fill all mandatory fields.', 'warning');
                return;
            }

            const payload = {
                resourceName,
                categoryId,
                location,
                capacity,
                facilities,
                status,
                imageUrl,
                description
            };

            const btn = document.getElementById('saveResourceBtn');
            btn.disabled = true;

            try {
                if (editId) {
                    await API.updateResource(editId, payload);
                    Common.showToast('Facility updated successfully.', 'success');
                } else {
                    await API.createResource(payload);
                    Common.showToast('Facility created successfully.', 'success');
                }
                resourceModalInstance.hide();
                loadResources();
            } catch (err) {
                Common.showToast(err.message || 'Failed to save facility.', 'error');
            } finally {
                btn.disabled = false;
            }
        }

        async function changeStatus(id, newStatus) {
            try {
                await API.updateResourceStatus(id, newStatus);
                Common.showToast(`Resource status changed to ${newStatus}`, 'info');
                loadResources();
            } catch (err) {
                Common.showToast(err.message || 'Status change failed', 'error');
            }
        }

        async function softDeleteResource(id) {
            if (!confirm('Are you sure you want to deactivate this resource? Historical booking data will be preserved.')) return;
            try {
                await API.deleteResource(id);
                Common.showToast('Resource deactivated successfully.', 'info');
                loadResources();
            } catch (err) {
                Common.showToast(err.message || 'Deactivation failed', 'error');
            }
        }
    </script>
</body>
</html>
